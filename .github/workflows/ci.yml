name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas numpy matplotlib seaborn pytest tabulate
      - run: python -m pytest -q
      - name: Generate synthetic sample data
        run: python -m src.make_sample_data
      - name: Pipeline runs end-to-end on synthetic data
        run: python -m src.run_all --data data/sample/city_day_synthetic.csv --fig-dir /tmp/figs --report /tmp/report.md
